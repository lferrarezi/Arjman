<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arjman Config</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      background-color: #1a1a1a;
      color: #fff;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #4CAF50;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #aaa;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: #4CAF50;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h2>🪄 Arjman Engine <span id="appVersion" style="font-size: 10px; color: #aaa; margin-left: auto; padding: 2px 6px; border: 1px solid #444; border-radius: 10px; font-weight: normal;"></span></h2>
  
  <div class="form-group">
    <label for="provider">LLM Provider</label>
    <select id="provider">
      <option value="groq">Groq (Recomendado - Rápido)</option>
      <option value="openai">OpenAI</option>
      <option value="nvidia">NVIDIA</option>
    </select>
  </div>

  <div class="form-group">
    <label for="apiKey">API Key (Armazenada localmente)</label>
    <input type="password" id="apiKey" placeholder="Sua chave secreta...">
  </div>

  <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="extremeMode" style="width: auto;">
    <label for="extremeMode" style="margin-bottom: 0; cursor: pointer;">Enable Extreme Compression Mode</label>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
